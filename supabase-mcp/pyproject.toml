[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supabase-mcp"
version = "0.1.0"
description = "Supabase MCP server for n8n workflow management"
requires-python = ">=3.9"
dependencies = [
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0"
] 